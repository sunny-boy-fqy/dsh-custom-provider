# @local/dsh-custom-provider bundle patch: one insert adding the host row.
#
# The browser half joins the web plugin graph automatically because
# package.json declares `dsh.client` and exports "./client".
#
# Configure the provider through the GUI (sidebar → 插件 → this row's 配置
# page) or by hand here. Verified shape:
#
#   - id: custom-provider
#     name: '@local/dsh-custom-provider'
#     config:
#       providerId: custom
#       displayName: 自定义供应商
#       models:
#         - id: ds-free
#           name: DS Free
#           candidates:
#             # Direct: this plugin dials the endpoint itself.
#             - id: primary
#               baseURL: https://gateway.example/v1
#               apiKey: sk-...
#               model: deepseek-v4
#             # Reuse: handed to a route that is already registered. `model` is
#             # that route's own model id; the endpoint and key belong to it.
#             - id: our-free-model-space-bunny-free
#               provider: our-free-model
#               model: space-bunny-free
#
# A candidate with no `provider` means "direct", so a configuration written
# before reuse existed keeps its exact meaning.
#
# Re-declaring the row by id (a non-`insert` entry) replaces only the fields it
# supplies; a new row must live under `insert:`.
- insert:
    - id: custom-provider
      name: '@local/dsh-custom-provider'
